<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RhymeJoy smoke tests</title>
<style>
  body{font-family:monospace;background:#111;color:#eee;padding:16px;}
  #stage{position:fixed;top:-9999px;left:-9999px;}
  #stage iframe{width:420px;height:1400px;border:0;}
  .pass{color:#7ec488;}
  .fail{color:#e07a7a;}
  #output{white-space:pre-wrap;}
  #summary{font-weight:bold;font-size:16px;margin-bottom:12px;}
</style>
</head>

<div id="summary">Running…</div>
<div id="output"></div>

<script>
// ---------------------------------------------------------------------
// Reusable smoke-test harness for rg-latest.html.
//
// Run it with test/run.sh (needs the app served over http/https — a fresh
// iframe is loaded per test, and Practices' fetch() of data/practices.md
// requires that, same as real deployment). Each test gets its own freshly
// loaded iframe so state from one test can't leak into the next — this is
// what would have caught the sensitive-word-mode pool bug and the
// stale-timerMode class of issue immediately instead of needing a manual
// repro.
//
// Add a test with test("name", async (doc, win) => { ... assert(...) }).
// Throw (via assert or otherwise) to fail; anything left in `errors`
// (populated from the iframe's window "error" event) fails the test too,
// even if the assertions all passed — this is what catches silent
// uncaught-exception regressions like the leftover timerStopBtn reference
// that broke the entire app's init.
// ---------------------------------------------------------------------

const tests = [];
function test(name, fn) { tests.push({ name, fn }); }

function assert(cond, msg) {
  if (!cond) throw new Error(msg || "assertion failed");
}
function assertEqual(actual, expected, msg) {
  if (actual !== expected) {
    throw new Error((msg ? msg + " — " : "") + `expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
}
function displayOf(el) { return getComputedStyle(el).display; }
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

function loadFreshApp() {
  return new Promise((resolve, reject) => {
    const iframe = document.createElement("iframe");
    const errors = [];
    iframe.addEventListener("load", () => {
      const win = iframe.contentWindow;
      win.addEventListener("error", (e) => errors.push(e.message + " @ " + e.filename + ":" + e.lineno));
      // let the app's init (generate(), the practices.md fetch, etc.) settle
      setTimeout(() => resolve({ iframe, doc: iframe.contentDocument, win, errors }), 500);
    });
    iframe.addEventListener("error", () => reject(new Error("iframe failed to load")));
    iframe.src = "../rg-latest.html";
    document.getElementById("stage").appendChild(iframe);
  });
}

function fire(el, type, x, y) {
  el.dispatchEvent(new PointerEvent(type, {
    bubbles: true, cancelable: true, pointerId: 1, isPrimary: true,
    button: 0, buttons: type === "pointerup" ? 0 : 1, clientX: x, clientY: y,
  }));
}

test("every JS-toggled hidden panel actually collapses to display:none", async (doc) => {

  doc.querySelector('.def-style-pill[data-def-style="links"]').click();
  assertEqual(displayOf(doc.getElementById("showAllDefsRow")), "none", "showAllDefsRow should hide outside Simple Definition mode");

  // Timer: Simple mode must hide the multi-only controls and squares —

  doc.getElementById("showTimerBtn").click();

  doc.querySelector('.timer-mode-pill[data-timer-mode="multi"]').click();

test("slant ratio slider actually shifts the perfect/slant mix of generated pairs", async (doc) => {
  doc.getElementById("advancedDetails").open = true;
  doc.getElementById("slantToggle").click();
  const typesOf = () => [...doc.querySelectorAll(".pair-card .type-chip")].map((el) => el.textContent);

  const ratioSlider = doc.getElementById("slantRatioSlider");
  ratioSlider.value = "0";
  ratioSlider.dispatchEvent(new Event("input", { bubbles: true }));
  assertEqual(doc.getElementById("slantRatioValue").textContent, "0% slant", "label should reflect 0%");
  ratioSlider.dispatchEvent(new Event("change", { bubbles: true }));
  assert(typesOf().every((t) => t === "perfect"), "ratio 0 should produce only perfect pairs, got " + typesOf().join(","));

  ratioSlider.value = "100";
  ratioSlider.dispatchEvent(new Event("input", { bubbles: true }));
  assertEqual(doc.getElementById("slantRatioValue").textContent, "100% slant", "label should reflect 100%");
  ratioSlider.dispatchEvent(new Event("change", { bubbles: true }));
  assert(typesOf().every((t) => t === "slant"), "ratio 100 should produce only slant pairs, got " + typesOf().join(","));
});

  ratioSlider.value = "40";

test("slant min-score slider persists and only keeps pairs meeting the threshold", async (doc, win) => {
  doc.getElementById("advancedDetails").open = true;
  doc.getElementById("slantToggle").click();
  doc.getElementById("slantRatioSlider").value = "100";
  doc.getElementById("slantRatioSlider").dispatchEvent(new Event("change", { bubbles: true }));

  const slider = doc.getElementById("slantMinScoreSlider");
  assertEqual(doc.getElementById("slantMinScoreValue").textContent, "≥ 3", "should default to the DB's lowest real score");

  slider.value = "80";
  slider.dispatchEvent(new Event("input", { bubbles: true }));
  const label = doc.getElementById("slantMinScoreValue").textContent;
  const threshold = Number(label.replace("≥ ", ""));
  assert(threshold > 3, "raising the slider should raise the displayed threshold");
  slider.dispatchEvent(new Event("change", { bubbles: true }));

  // A tight threshold can shrink the filtered slant pool below the
  // requested count, in which case the ratio logic correctly falls back to
  // filling the rest from perfect rhymes rather than under-delivering — so
  // only the slant-typed cards need to honor the score threshold here.
  const slantPairs = [...doc.querySelectorAll(".pair-card")]
    .filter((card) => card.querySelector(".type-chip").textContent === "slant")
    .map((card) => [...card.querySelectorAll(".word")].map((el) => el.textContent));
  assert(slantPairs.length > 0, "expected at least one slant pair even at a high threshold");
  const byPair = win.eval("Object.fromEntries(SLANT_RHYMES_DATAMUSE.pairs.map(p => [p.a + '|' + p.b, Math.max(p.score_a ?? -Infinity, p.score_b ?? -Infinity)]))");
  for (const [a, b] of slantPairs) {
    const score = byPair[a + "|" + b] ?? byPair[b + "|" + a];
    assert(score !== undefined, `${a}/${b} should be a known slant pair`);
    assert(score >= threshold, `${a}/${b} scored ${score}, below the ${threshold} threshold`);
  }

  const fresh = await loadFreshApp();
  try {
    assertEqual(fresh.doc.getElementById("slantMinScoreSlider").value, "80", "min-score slider position should persist across a reload");
  } finally {
    fresh.iframe.remove();
  }
});

test("reveal mode letter/family/syllable never leak the full word", async (doc) => {
  const wordOf = () => doc.querySelector('.word-slot[data-pair-part="b"] .word').textContent;

  assertEqual(wordOf().length, 1, "letter mode should show exactly one character");

  assertEqual(wordOf(), "•", "syllable mode should show exactly one bullet, no letters");

  doc.querySelector('.reveal-mode-pill[data-reveal-mode="family"]').click();

});

// ---- sensitive-words "only" mode: at least one side per pair ----

test('sensitive mode "only" produces pairs with exactly one flagged word, always in slot a', async (doc, win) => {
  doc.getElementById("advancedDetails").open = true;
  doc.querySelector('.sensitive-mode-pill[data-sensitive-mode="only"]').click();
  const cards = [...doc.querySelectorAll(".pair-card")];
  assert(cards.length > 0, "expected at least one pair in only mode");
  const blocked = win.eval("Array.from(new Set(Object.values(SENSITIVE_WORDS).flat()))");
  for (const card of cards) {
    const words = [...card.querySelectorAll(".word")].map((el) => el.textContent);
    const aFlagged = blocked.includes(words[0]);
    const bFlagged = blocked.includes(words[1]);
    assert(aFlagged !== bFlagged, `expected exactly one flagged word in ${words.join(" / ")}`);
    assert(aFlagged, `expected the sensitive word to be in slot a, got ${words.join(" / ")}`);
  }
});

test("word deletion removes only the clicked pair, not a fresh batch", async (doc) => {
  assertEqual(displayOf(doc.getElementById("deletedWordsSection")), "none", "deleted words section should start hidden with nothing deleted");
  const before = doc.querySelectorAll(".pair-card").length;
  const firstWords = [...doc.querySelectorAll(".pair-card")].slice(1).map((c) => c.querySelector(".word").textContent);
  doc.querySelector('.def-style-pill[data-def-style="delete"]').click();
  doc.querySelector(".pair-card .word-delete").click();
  assertEqual(doc.querySelectorAll(".pair-card").length, before - 1, "exactly one card should be removed");
  const afterWords = [...doc.querySelectorAll(".pair-card")].map((c) => c.querySelector(".word").textContent);
  assertEqual(JSON.stringify(afterWords), JSON.stringify(firstWords), "the remaining cards should be untouched, not a new random batch");
  assertEqual(displayOf(doc.getElementById("deletedWordsSection")), "block", "deleted words section should reveal itself once a word is deleted");
  doc.getElementById("clearDeletedBtn").click();
  assertEqual(displayOf(doc.getElementById("deletedWordsSection")), "none", "deleted words section should re-hide once cleared");
});

test("timer: loop enabled in multi mode must not leak into simple mode", async (doc) => {
  doc.getElementById("advancedDetails").open = true;
  doc.querySelector('.timer-duration-unit-pill[data-timer-duration-unit="seconds"]').click();
  const inputs = doc.querySelectorAll(".timer-duration-input");
  inputs[0].value = "1";
  inputs[0].dispatchEvent(new Event("change", { bubbles: true }));

  doc.getElementById("showTimerBtn").click();
  doc.querySelector('.timer-mode-pill[data-timer-mode="multi"]').click();
  doc.getElementById("timerLoopBtn").click();
  assert(doc.getElementById("timerLoopBtn").classList.contains("active"), "loop should be on after enabling it in multi mode");

  doc.querySelector('.timer-mode-pill[data-timer-mode="simple"]').click();
  doc.querySelector('.timer-duration-btn[data-minutes="1"]').click();
  assertEqual(doc.getElementById("timerCountdown").textContent, "0:01");

  await sleep(1300); // let the 1s countdown actually complete
  assertEqual(displayOf(doc.getElementById("timerSetup")), "flex", "simple timer should stop after finishing, not loop back to running");
  assertEqual(displayOf(doc.getElementById("timerRunning")), "none", "running view should hide once the un-looped simple timer finishes");
});

// preload="none" means real audio metadata never loads under the test
// harness (no play()-triggering user gesture reaches the iframe), so these
// mock the audio element's duration/currentTime the way a real file would
// report them once loaded, then dispatch the events app.js listens for.
test("local player seek bar tracks loaded metadata and resets when the track changes", async (doc) => {
  const select = doc.getElementById("playlistSourceSelect");
  select.value = "local";
  select.dispatchEvent(new Event("change", { bubbles: true }));

  const audio = doc.getElementById("localPlayerAudio");
  const seek = doc.getElementById("localPlayerSeek");
  const currentEl = doc.getElementById("localPlayerCurrentTime");
  const durationEl = doc.getElementById("localPlayerDuration");

  assertEqual(currentEl.textContent, "0:00", "current time should start at 0:00");
  assertEqual(durationEl.textContent, "0:00", "duration should show 0:00 before metadata loads");
  assertEqual(seek.max, "0", "seek max should be 0 before metadata loads");

  Object.defineProperty(audio, "duration", { value: 187, configurable: true });
  Object.defineProperty(audio, "currentTime", { value: 42, configurable: true });
  audio.dispatchEvent(new Event("loadedmetadata"));

  assertEqual(durationEl.textContent, "3:07", "duration label should reflect the loaded metadata");
  assertEqual(seek.max, "187", "seek max should match the loaded duration");
  assertEqual(seek.value, "42", "seek value should sync to currentTime once metadata is known");
  assertEqual(currentEl.textContent, "0:42", "current time label should reflect currentTime");

  // Restore the real (native) duration/currentTime accessors — a static
  // mock would never naturally revert to NaN/0 the way a real browser does
  // when .src changes, so the reset assertion below needs the genuine
  // preload="none" behavior, not our frozen stand-in.
  delete audio.duration;
  delete audio.currentTime;
  doc.getElementById("localPlayerNextBtn").click();
  assertEqual(durationEl.textContent, "0:00", "switching tracks should reset the duration label until the new file's metadata loads");
  assertEqual(currentEl.textContent, "0:00", "switching tracks should reset the current-time label");
  assertEqual(seek.max, "0", "switching tracks should reset the seek max");
});

test("dragging the local player seek bar seeks the audio and ignores timeupdate jitter mid-drag", async (doc) => {
  const select = doc.getElementById("playlistSourceSelect");
  select.value = "local";
  select.dispatchEvent(new Event("change", { bubbles: true }));

  const audio = doc.getElementById("localPlayerAudio");
  const seek = doc.getElementById("localPlayerSeek");
  const currentEl = doc.getElementById("localPlayerCurrentTime");

  let mockCurrentTime = 0;
  Object.defineProperty(audio, "duration", { value: 200, configurable: true });
  Object.defineProperty(audio, "currentTime", {
    configurable: true,
    get: () => mockCurrentTime,
    set: (v) => { mockCurrentTime = v; },
  });
  audio.dispatchEvent(new Event("loadedmetadata"));

  seek.value = "50";
  seek.dispatchEvent(new Event("input", { bubbles: true }));
  assertEqual(mockCurrentTime, 50, "dragging the seek bar should set the audio's currentTime");
  assertEqual(currentEl.textContent, "0:50", "current time label should update live while dragging");

  seek.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true }));
  seek.value = "80";
  seek.dispatchEvent(new Event("input", { bubbles: true }));
  assertEqual(mockCurrentTime, 80, "continuing to drag should keep seeking the audio");

  // Simulate a stale 'timeupdate' arriving mid-drag from the pre-seek
  // position — it must not yank the handle backward while the user is
  // still holding it. The label stays on the dragged-to position (1:20,
  // set live by the 'input' handler above), not the stale timeupdate's.
  mockCurrentTime = 51;
  audio.dispatchEvent(new Event("timeupdate"));
  assertEqual(seek.value, "80", "seek handle should stay put during a drag, ignoring a stale timeupdate");
  assertEqual(currentEl.textContent, "1:20", "current time label should stay put during a drag, ignoring a stale timeupdate");

  seek.dispatchEvent(new PointerEvent("pointerup", { bubbles: true }));
  mockCurrentTime = 80;
  audio.dispatchEvent(new Event("timeupdate"));
  assertEqual(seek.value, "80", "seek handle should resume following timeupdate once the drag ends");
  assertEqual(currentEl.textContent, "1:20", "current time label should resume following timeupdate once the drag ends");
});

test("uneven division carries the in-progress turn into the next refresh instead of restarting", async (doc) => {
  doc.getElementById("collabToggle").click();
  const countInput = doc.getElementById("collabCountInput");
  countInput.value = "3";
  countInput.dispatchEvent(new Event("change", { bubbles: true }));
  const turnSelect = doc.getElementById("collabPairsPerTurnSelect");
  turnSelect.value = "3";
  turnSelect.dispatchEvent(new Event("change", { bubbles: true }));

  // 3 collaborators x 3 pairs per turn = 9 pairs per full rotation: with 20
  // pairs that's 2 full rotations (18) plus 2 leftover pairs that start
  // person 1's next turn rather than splitting unevenly here.
  const batch1 = collabColorsOf(doc);
  assertEqual(batch1.length, 20);
  assert(batch1.slice(0, 3).every((c) => c === COLLAB_COLORS[0]), "pairs 1-3 should be person 1's turn, got " + batch1.join(","));
  assert(batch1.slice(3, 6).every((c) => c === COLLAB_COLORS[1]), "pairs 4-6 should be person 2's turn, got " + batch1.join(","));
  assert(batch1.slice(6, 9).every((c) => c === COLLAB_COLORS[2]), "pairs 7-9 should be person 3's turn, got " + batch1.join(","));
  assert(batch1.slice(9, 12).every((c) => c === COLLAB_COLORS[0]), "pairs 10-12 should be person 1's turn, got " + batch1.join(","));
  assert(batch1.slice(12, 15).every((c) => c === COLLAB_COLORS[1]), "pairs 13-15 should be person 2's turn, got " + batch1.join(","));
  assert(batch1.slice(15, 18).every((c) => c === COLLAB_COLORS[2]), "pairs 16-18 should be person 3's turn, got " + batch1.join(","));
  assert(batch1.slice(18, 20).every((c) => c === COLLAB_COLORS[0]), "the 2 leftover pairs should start person 1's next turn, got " + batch1.join(","));

  doc.getElementById("refreshBtnTop").click();

  // Person 1's turn (2 pairs in from batch 1) carries over: 1 more pair
  // completes it before the rotation continues to person 2, then 3, then
  // wraps back to person 1 for the remainder.
  const batch2 = collabColorsOf(doc);
  assertEqual(batch2.length, 20);
  assert(batch2.slice(0, 1).every((c) => c === COLLAB_COLORS[0]), "the first pair of the next batch should complete person 1's carried-over turn, got " + batch2.join(","));
  assert(batch2.slice(1, 4).every((c) => c === COLLAB_COLORS[1]), "person 2's turn should follow, got " + batch2.join(","));
  assert(batch2.slice(4, 7).every((c) => c === COLLAB_COLORS[2]), "person 3's turn should follow, got " + batch2.join(","));
  assert(batch2.slice(7, 10).every((c) => c === COLLAB_COLORS[0]), "rotation should continue back to person 1, got " + batch2.join(","));
});

// Clicks each category pill to whatever on/off state `wanted` (a Set of
// category ids to enable) says it should be, only clicking pills that are
// actually changing state — a blind click-every-pill loop double-toggles
// pills already in the target state instead of leaving them alone.
function setCategories(doc, wanted) {
  doc.querySelectorAll(".category-pill").forEach((btn) => {
    const shouldBeOn = wanted.has(btn.dataset.category);
    if (btn.classList.contains("active") !== shouldBeOn) btn.click();
  });
}

  const words = pairWordsOf(doc);
  assert(words.length > 0, "expected at least one pair from the animals-only pool");
  assert(words.every((w) => ANIMALS_CATEGORY_WORDS.has(w)), "every generated word should be tagged animals, got " + words.join(","));
});

test("disabling every category yields the empty state", async (doc) => {
  setCategories(doc, new Set());
  assertEqual(doc.querySelectorAll(".pair-card").length, 0, "no pairs should be generated with every category disabled");
  assert(!!doc.querySelector(".empty-state"), "the empty-state message should show instead");
});

test("category toggles persist across a reload", async (doc) => {
  setCategories(doc, new Set(["food", "animals"]));
  await sleep(50);

  const fresh = await loadFreshApp();
  try {
    const active = new Set(
      [...fresh.doc.querySelectorAll(".category-pill.active")].map((btn) => btn.dataset.category)
    );
    assertEqual(active.size, 2, "expected exactly 2 categories to persist as enabled, got " + [...active].join(","));
    assert(active.has("food") && active.has("animals"), "food and animals should be the persisted enabled categories");
  } finally {
    fresh.iframe.remove();
  }
});

// ---- word type (part of speech) ----

// Clicks each POS pill to whatever on/off state `wanted` (a Set of POS ids
// to enable) says it should be, mirroring setCategories above.
function setPos(doc, wanted) {
  doc.querySelectorAll(".pos-pill").forEach((btn) => {
    const shouldBeOn = wanted.has(btn.dataset.pos);
    if (btn.classList.contains("active") !== shouldBeOn) btn.click();
  });
}

test("word type defaults to all enabled, and the row is English-only", async (doc) => {
  const pills = doc.querySelectorAll(".pos-pill");
  assertEqual(pills.length, 5, "expected all 5 word-type pills");
  assert([...pills].every((btn) => btn.classList.contains("active")), "every word type should start enabled");
  assertEqual(displayOf(doc.getElementById("posRow")), "flex", "word-type row should be visible for English");

  doc.querySelector('.lang-pill[data-lang="nl"]').click();
  assertEqual(displayOf(doc.getElementById("posRow")), "none", "word-type row should hide for a non-English language");

  doc.querySelector('.lang-pill[data-lang="en"]').click();
  assertEqual(displayOf(doc.getElementById("posRow")), "flex", "word-type row should reappear back on English");
  assert([...doc.querySelectorAll(".pos-pill")].every((btn) => btn.classList.contains("active")), "word-type selection should be untouched by the language round-trip");
});

test("enabling only 'verb' restricts generated pairs to verb-tagged words", async (doc, win) => {
  setPos(doc, new Set(["verb"]));
  const words = pairWordsOf(doc);
  assert(words.length > 0, "expected at least one pair from the verb-only pool");
  // POS_DATA is declared with `const` in a classic <script src>, so it's a
  // script-scope binding, not a window property — win.POS_DATA is
  // undefined from outside. win.eval runs in that global scope, so it can
  // still see it.
  const posData = win.eval("POS_DATA");
  assert(words.every((w) => (posData[w] || []).includes("verb")), "every generated word should be tagged verb, got " + words.join(","));
});

// ---- runner ----

async function runAll() {
  const results = [];
  for (const { name, fn } of tests) {
    let ctx;
    try {
      // smoke.html and rg-latest.html are same-origin (same http server),
      // so this clears the storage each test's first iframe loads with.
      // Needed now that timerMode/timerLoop/timerDurationMinutes persist
      // (previously only theme/timerSound/etc did) — otherwise one test's
      // saved state leaks into the next test's "fresh" iframe. Cleared only
      // here, once per top-level test, not inside loadFreshApp() itself —
      // "settings survive a reload" calls loadFreshApp() a second time
      // mid-test specifically to check its own just-saved settings persist.
      localStorage.clear();
      ctx = await loadFreshApp();
      await fn(ctx.doc, ctx.win, ctx);
      if (ctx.errors.length) throw new Error("uncaught error(s) in app: " + ctx.errors.join(" | "));
      results.push({ name, pass: true });
    } catch (e) {
      results.push({ name, pass: false, error: e.message });
    } finally {
      if (ctx) ctx.iframe.remove();
    }
  }
  return results;
}

runAll().then((results) => {
  const passCount = results.filter((r) => r.pass).length;
  const failCount = results.length - passCount;
  document.getElementById("summary").textContent = `${passCount}/${results.length} passed` + (failCount ? `, ${failCount} FAILED` : "");
  document.getElementById("summary").className = failCount ? "fail" : "pass";
  document.getElementById("output").innerHTML = results.map((r) =>
    r.pass
      ? `<div class="pass">✓ ${r.name}</div>`
      : `<div class="fail">✗ ${r.name}\n    ${r.error}</div>`
  ).join("\n");
  // machine-readable summary for test/run.sh to grep
  const marker = document.createElement("div");
  marker.id = "smoke-test-result";
  const summary = JSON.stringify({ passCount, failCount, total: results.length, results });
  marker.setAttribute("data-json", summary);
  document.body.appendChild(marker);

  // test/run.sh can't rely on --dump-dom's timing (it doesn't wait around for
  // a page that keeps loading iframes for several seconds after its own load
  // event), so it needs some other signal it can poll for completion. This
  // used to be encoded into document.title and read back via Chrome's
  // DevTools /json endpoint, but that endpoint truncates long titles — once
  // the suite grew past ~4000 characters of encoded JSON, run.sh always got
  // a truncated, undecodable string. POSTing the JSON straight to
  // test/smoke_server.py's /__smoke_result__ endpoint (which writes it to a
  // file run.sh polls for) has no such size limit. document.title still gets
  // a short human-readable summary, for anyone running this by hand.
  document.title = failCount ? `Smoke: ${failCount}/${results.length} FAILED` : `Smoke: ${passCount}/${results.length} passed`;
  fetch("/__smoke_result__", { method: "POST", body: summary }).catch(() => {});
});
