<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RhymeFlow smoke tests</title>
<style>
  body{font-family:monospace;background:#111;color:#eee;padding:16px;}
  #stage{position:fixed;top:-9999px;left:-9999px;}
  #stage iframe{width:420px;height:1400px;border:0;}
  .pass{color:#7ec488;}
  .fail{color:#e07a7a;}
  #output{white-space:pre-wrap;}
  #summary{font-weight:bold;font-size:16px;margin-bottom:12px;}
</style>
</head>
<body>
<div id="summary">Running…</div>
<div id="output"></div>
<div id="stage"></div>

<script>
// ---------------------------------------------------------------------
// Reusable smoke-test harness for rg-latest.html.
//
// Run it with test/run.sh (needs the app served over http/https — a fresh
// iframe is loaded per test, and Practices' fetch() of data/practices.md
// requires that, same as real deployment). Each test gets its own freshly
// loaded iframe so state from one test can't leak into the next — this is
// what would have caught the sensitive-word-mode pool bug and the
// stale-timerMode class of issue immediately instead of needing a manual
// repro.
//
// Add a test with test("name", async (doc, win) => { ... assert(...) }).
// Throw (via assert or otherwise) to fail; anything left in `errors`
// (populated from the iframe's window "error" event) fails the test too,
// even if the assertions all passed — this is what catches silent
// uncaught-exception regressions like the leftover timerStopBtn reference
// that broke the entire app's init.
// ---------------------------------------------------------------------

const tests = [];
function test(name, fn) { tests.push({ name, fn }); }

function assert(cond, msg) {
  if (!cond) throw new Error(msg || "assertion failed");
}
function assertEqual(actual, expected, msg) {
  if (actual !== expected) {
    throw new Error((msg ? msg + " — " : "") + `expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
  }
}
function displayOf(el) { return getComputedStyle(el).display; }
function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

function loadFreshApp() {
  return new Promise((resolve, reject) => {
    const iframe = document.createElement("iframe");
    const errors = [];
    iframe.addEventListener("load", () => {
      const win = iframe.contentWindow;
      win.addEventListener("error", (e) => errors.push(e.message + " @ " + e.filename + ":" + e.lineno));
      // let the app's init (generate(), the practices.md fetch, etc.) settle
      setTimeout(() => resolve({ iframe, doc: iframe.contentDocument, win, errors }), 500);
    });
    iframe.addEventListener("error", () => reject(new Error("iframe failed to load")));
    iframe.src = "../rg-latest.html";
    document.getElementById("stage").appendChild(iframe);
  });
}

function fire(el, type, x, y) {
  el.dispatchEvent(new PointerEvent(type, {
    bubbles: true, cancelable: true, pointerId: 1, isPrimary: true,
    button: 0, buttons: type === "pointerup" ? 0 : 1, clientX: x, clientY: y,
  }));
}

// ---- baseline ----

test("app loads and generates the requested pairs with no console errors", async (doc) => {
  assertEqual(doc.querySelectorAll(".pair-card").length, 20);
});

test("practices load with at least one button", async (doc) => {
  assert(!doc.getElementById("practicesPanel").hidden, "practicesPanel should not be hidden");
  assert(doc.querySelectorAll(".practice-pill").length >= 1, "expected at least one practice button");
});

test("clicking a practice button reveals its content", async (doc) => {
  const btn = doc.querySelector(".practice-pill");
  const content = doc.querySelector(".practice-content");
  assert(content.hidden, "practice content should start hidden");
  btn.click();
  assert(!content.hidden, "practice content should be visible after click");
});

// ---- broad interaction sweep: catches uncaught-exception regressions ----

test("broad click sweep across every major control throws no errors", async (doc) => {
  doc.getElementById("guidelinesDetails").open = true;
  doc.getElementById("advancedDetails").open = true;
  const selectors = [
    ".lang-pill", ".count-pill", ".sensitive-mode-pill", ".reveal-mode-pill",
    ".def-style-pill", ".practice-pill", ".timer-mode-pill", ".theme-swatch",
    ".timer-duration-btn", "#timerLoopBtn", "#timerReturnBtn", "#timerConfirmBtn",
    "#timerSoundPreviewBtn", ".timer-sound-pill", "#showAllDefsBtn", "#csvResetBtn",
    "#csvExampleBtn", "#refreshBtnTop", "#refreshBtnBottom", "#playlistToggle",
    "#autoRefreshToggle", "#downloadDeletedBtn", "#clearDeletedBtn", "#showTimerBtn",
    "#hideUiBtn",
  ];
  let clicked = 0;
  for (const sel of selectors) {
    doc.querySelectorAll(sel).forEach((el) => { el.click(); clicked++; });
  }
  assert(clicked > 30, `expected to click 30+ elements, only found ${clicked}`);
});

// ---- the [hidden]-vs-CSS-display bug class (bit twice this session) ----

test("every JS-toggled hidden panel actually collapses to display:none", async (doc) => {
  doc.getElementById("advancedDetails").open = true;

  // Reveal mode "words": word B's slot + tie should collapse (visibility,
  // not display, for this one — see .pairs.single-words in styles.css)
  doc.querySelector('.reveal-mode-pill[data-reveal-mode="words"]').click();
  const slotB = doc.querySelector('.word-slot[data-pair-part="b"]');
  assertEqual(getComputedStyle(slotB).visibility, "hidden", "word B should be visibility:hidden in Single words mode");
  doc.querySelector('.reveal-mode-pill[data-reveal-mode="pairs"]').click();

  // Definitions "simple": showAllDefsRow appears; any other style should hide it
  doc.querySelector('.def-style-pill[data-def-style="simple"]').click();
  assertEqual(displayOf(doc.getElementById("showAllDefsRow")), "flex", "showAllDefsRow should show in Simple Definition mode");
  doc.querySelector('.def-style-pill[data-def-style="links"]').click();
  assertEqual(displayOf(doc.getElementById("showAllDefsRow")), "none", "showAllDefsRow should hide outside Simple Definition mode");

  // Timer: Simple mode must hide the multi-only controls and squares —
  // this exact check (computed display, not just the `hidden` property)
  // is what would have caught the .timer-multi-actions bug immediately.
  doc.getElementById("showTimerBtn").click();
  assertEqual(displayOf(doc.getElementById("timerMultiActions")), "none", "timerMultiActions should be display:none in Simple mode");
  assertEqual(displayOf(doc.getElementById("timerSequence")), "none", "timerSequence should be display:none in Simple mode");
  doc.querySelector('.timer-mode-pill[data-timer-mode="multi"]').click();
  assertEqual(displayOf(doc.getElementById("timerMultiActions")), "flex", "timerMultiActions should show in Multi mode");
  assertEqual(displayOf(doc.getElementById("timerSequence")), "flex", "timerSequence should show in Multi mode");
});

// ---- reveal modes mask content correctly ----

test("reveal mode letter/family/syllable never leak the full word", async (doc) => {
  const wordOf = () => doc.querySelector('.word-slot[data-pair-part="b"] .word').textContent;

  doc.querySelector('.reveal-mode-pill[data-reveal-mode="letter"]').click();
  assertEqual(wordOf().length, 1, "letter mode should show exactly one character");

  doc.querySelector('.reveal-mode-pill[data-reveal-mode="syllable"]').click();
  assertEqual(wordOf(), "•", "syllable mode should show exactly one bullet, no letters");

  doc.querySelector('.reveal-mode-pill[data-reveal-mode="family"]').click();
  assert(!wordOf().includes("•"), "family mode should show bare letters, no bullets");
});

// ---- sensitive-words "only" mode: at least one side per pair ----

test('sensitive mode "only" produces pairs with exactly one flagged word, always in slot a', async (doc, win) => {
  doc.getElementById("advancedDetails").open = true;
  doc.querySelector('.sensitive-mode-pill[data-sensitive-mode="only"]').click();
  const cards = [...doc.querySelectorAll(".pair-card")];
  assert(cards.length > 0, "expected at least one pair in only mode");
  const blocked = win.eval("Array.from(new Set(Object.values(SENSITIVE_WORDS).flat()))");
  for (const card of cards) {
    const words = [...card.querySelectorAll(".word")].map((el) => el.textContent);
    const aFlagged = blocked.includes(words[0]);
    const bFlagged = blocked.includes(words[1]);
    assert(aFlagged !== bFlagged, `expected exactly one flagged word in ${words.join(" / ")}`);
    assert(aFlagged, `expected the sensitive word to be in slot a, got ${words.join(" / ")}`);
  }
});

// ---- word deletion: removes just the one card, no full refresh ----

test("word deletion removes only the clicked pair, not a fresh batch", async (doc) => {
  const before = doc.querySelectorAll(".pair-card").length;
  const firstWords = [...doc.querySelectorAll(".pair-card")].slice(1).map((c) => c.querySelector(".word").textContent);
  doc.querySelector('.def-style-pill[data-def-style="delete"]').click();
  doc.querySelector(".pair-card .word-delete").click();
  assertEqual(doc.querySelectorAll(".pair-card").length, before - 1, "exactly one card should be removed");
  const afterWords = [...doc.querySelectorAll(".pair-card")].map((c) => c.querySelector(".word").textContent);
  assertEqual(JSON.stringify(afterWords), JSON.stringify(firstWords), "the remaining cards should be untouched, not a new random batch");
});

// ---- timer end-to-end ----

test("timer: simple duration starts a countdown that can be stopped", async (doc) => {
  doc.getElementById("showTimerBtn").click();
  doc.querySelector('.timer-duration-btn[data-minutes="5"]').click();
  assertEqual(displayOf(doc.getElementById("timerRunning")), "flex", "running view should show");
  assertEqual(displayOf(doc.getElementById("timerSetup")), "none", "setup view should hide while running");
  assertEqual(doc.getElementById("timerCountdown").textContent, "5:00");
  doc.getElementById("timerCountdown").click();
  assertEqual(displayOf(doc.getElementById("timerSetup")), "flex", "setup view should return after stopping");
});

test("timer: multi mode builds a sequence, Return undoes, Loop toggles", async (doc) => {
  doc.getElementById("advancedDetails").open = true;
  doc.getElementById("showTimerBtn").click();
  doc.querySelector('.timer-mode-pill[data-timer-mode="multi"]').click();
  doc.querySelector('.timer-duration-btn[data-minutes="10"]').click();
  doc.querySelector('.timer-duration-btn[data-minutes="5"]').click();
  assertEqual(doc.querySelectorAll("#timerSequence .timer-square").length, 2);
  doc.getElementById("timerReturnBtn").click();
  assertEqual(doc.querySelectorAll("#timerSequence .timer-square").length, 1);
  doc.getElementById("timerLoopBtn").click();
  assert(doc.getElementById("timerLoopBtn").classList.contains("active"), "loop button should be active after click");
});

test("timer durations are editable, apply live, and persist", async (doc) => {
  doc.getElementById("advancedDetails").open = true;
  const inputs = doc.querySelectorAll(".timer-duration-input");
  assertEqual(inputs.length, 6, "expected 6 duration inputs");
  assertEqual(inputs[0].value, "5", "first duration input should default to 5");
  inputs[0].value = "7";
  inputs[0].dispatchEvent(new Event("change", { bubbles: true }));
  assertEqual(doc.querySelector('.timer-duration-btn').dataset.minutes, "7", "editing the input should update the matching button's data-minutes");
  assertEqual(doc.querySelector('.timer-duration-btn').textContent, "7m", "editing the input should update the matching button's label");
  doc.getElementById("showTimerBtn").click();
  doc.querySelector(".timer-duration-btn").click();
  assertEqual(doc.getElementById("timerCountdown").textContent, "7:00", "starting the edited duration should count down from the new value");

  const fresh = await loadFreshApp();
  try {
    fresh.doc.getElementById("advancedDetails").open = true;
    assertEqual(fresh.doc.querySelector(".timer-duration-input").value, "7", "edited duration should persist across a reload");
  } finally {
    fresh.iframe.remove();
  }
});

test("timer duration unit toggles between minutes and seconds, relabels everything, and persists", async (doc) => {
  doc.getElementById("advancedDetails").open = true;
  assert(doc.querySelector('.timer-duration-unit-pill[data-timer-duration-unit="minutes"]').classList.contains("active"), "minutes should be the default unit");
  assertEqual(doc.querySelector(".timer-duration-btn").textContent, "5m", "duration buttons should default to minutes");

  doc.querySelector('.timer-duration-unit-pill[data-timer-duration-unit="seconds"]').click();
  assert(doc.querySelector('.timer-duration-unit-pill[data-timer-duration-unit="seconds"]').classList.contains("active"), "seconds pill should become active");
  assert(!doc.querySelector('.timer-duration-unit-pill[data-timer-duration-unit="minutes"]').classList.contains("active"), "minutes pill should no longer be active");
  assertEqual(doc.querySelector(".timer-duration-btn").textContent, "5s", "duration buttons should relabel to seconds");

  doc.getElementById("showTimerBtn").click();
  doc.querySelector(".timer-duration-btn").click();
  assertEqual(doc.getElementById("timerCountdown").textContent, "0:05", "starting a duration in seconds mode should count down in seconds, not minutes");

  const fresh = await loadFreshApp();
  try {
    fresh.doc.getElementById("advancedDetails").open = true;
    assert(fresh.doc.querySelector('.timer-duration-unit-pill[data-timer-duration-unit="seconds"]').classList.contains("active"), "seconds unit should persist across a reload");
  } finally {
    fresh.iframe.remove();
  }
});

test("starting a timer flashes the PRACTICE wordart", async (doc) => {
  const flash = doc.getElementById("practiceFlash");
  assert(!flash.classList.contains("show"), "flash should not be showing before a timer starts");
  doc.getElementById("showTimerBtn").click();
  doc.querySelector(".timer-duration-btn").click();
  assert(flash.classList.contains("show"), "flash should show once a timer queue actually starts");
});

test("practice wordart flash picks one of 7 known rollins, no stale rollin class on retrigger", async (doc) => {
  const ROLLINS = ["glow", "slide", "flicker", "wipe", "glitch", "zoom", "flip"];
  const flash = doc.getElementById("practiceFlash");
  const flashRollinClasses = () => ROLLINS.filter((s) => flash.classList.contains(`flash-${s}`));

  doc.getElementById("showTimerBtn").click();
  doc.querySelector('.timer-duration-btn[data-minutes="5"]').click();
  assertEqual(flashRollinClasses().length, 1, "exactly one flash-* rollin class should be applied");

  // Stop and start again — the remove/reflow/add retrigger dance should
  // clear the previous rollin class, not stack a second one alongside it.
  doc.getElementById("timerCountdown").click();
  doc.querySelector('.timer-duration-btn[data-minutes="10"]').click();
  assertEqual(flashRollinClasses().length, 1, "still exactly one flash-* rollin class after retriggering");
});

test("practice wordart flash picks one of 7 known visual styles, independent of the rollin, no stale style class on retrigger", async (doc) => {
  const STYLES = ["outline", "mono", "card", "underline", "italic", "wide", "neon"];
  const flash = doc.getElementById("practiceFlash");
  const flashStyleClasses = () => STYLES.filter((s) => flash.classList.contains(`style-${s}`));

  doc.getElementById("showTimerBtn").click();
  doc.querySelector('.timer-duration-btn[data-minutes="5"]').click();
  assertEqual(flashStyleClasses().length, 1, "exactly one style-* class should be applied");

  // Stop and start again — the remove/reflow/add retrigger dance should
  // clear the previous style class, not stack a second one alongside it.
  doc.getElementById("timerCountdown").click();
  doc.querySelector('.timer-duration-btn[data-minutes="10"]').click();
  assertEqual(flashStyleClasses().length, 1, "still exactly one style-* class after retriggering");
});

test("timer options collapse when the timer is hidden", async (doc) => {
  doc.getElementById("advancedDetails").open = true;
  assertEqual(displayOf(doc.getElementById("timerOptionsGroup")), "none", "timer options should start collapsed");
  doc.getElementById("showTimerBtn").click();
  assertEqual(displayOf(doc.getElementById("timerOptionsGroup")), "block", "timer options should expand once the timer is shown");
  doc.getElementById("showTimerBtn").click();
  assertEqual(displayOf(doc.getElementById("timerOptionsGroup")), "none", "timer options should collapse again once the timer is hidden");
});

// ---- metronome end-to-end ----

test("metronome: show toggles the panel, Start/Stop toggles ticking", async (doc) => {
  assertEqual(displayOf(doc.getElementById("metronomePanel")), "none", "metronome panel should start hidden");
  doc.getElementById("advancedDetails").open = true;
  doc.getElementById("showMetronomeBtn").click();
  assertEqual(displayOf(doc.getElementById("metronomePanel")), "flex", "metronome panel should show");
  assertEqual(doc.getElementById("showMetronomeBtn").textContent, "Hide metronome");

  const toggleBtn = doc.getElementById("metronomeToggleBtn");
  assertEqual(toggleBtn.textContent, "Start");
  toggleBtn.click();
  assertEqual(toggleBtn.textContent, "Stop", "button should flip to Stop once running");
  toggleBtn.click();
  assertEqual(toggleBtn.textContent, "Start", "button should flip back to Start once stopped");

  doc.getElementById("showMetronomeBtn").click();
  assertEqual(displayOf(doc.getElementById("metronomePanel")), "none", "metronome panel should hide again");
});

test("metronome: hiding the panel while running stops the ticking", async (doc) => {
  doc.getElementById("advancedDetails").open = true;
  doc.getElementById("showMetronomeBtn").click();

  const toggleBtn = doc.getElementById("metronomeToggleBtn");
  toggleBtn.click();
  assertEqual(toggleBtn.textContent, "Stop", "button should flip to Stop once running");

  doc.getElementById("showMetronomeBtn").click();
  assertEqual(displayOf(doc.getElementById("metronomePanel")), "none", "metronome panel should hide");

  doc.getElementById("showMetronomeBtn").click();
  assertEqual(displayOf(doc.getElementById("metronomePanel")), "flex", "metronome panel should show again");
  assertEqual(toggleBtn.textContent, "Start", "metronome should have stopped running while hidden");
});

test("metronome BPM slider updates the displayed value and persists", async (doc) => {
  doc.getElementById("advancedDetails").open = true;
  doc.getElementById("showMetronomeBtn").click();
  assertEqual(doc.getElementById("metronomeBpmValue").textContent, "120 BPM", "should default to 120 BPM");

  const slider = doc.getElementById("metronomeBpmSlider");
  slider.value = "90";
  slider.dispatchEvent(new Event("input", { bubbles: true }));
  assertEqual(doc.getElementById("metronomeBpmValue").textContent, "90 BPM", "changing the slider should update the displayed BPM");
  slider.dispatchEvent(new Event("change", { bubbles: true }));

  const fresh = await loadFreshApp();
  try {
    fresh.doc.getElementById("advancedDetails").open = true;
    fresh.doc.getElementById("showMetronomeBtn").click();
    assertEqual(fresh.doc.getElementById("metronomeBpmSlider").value, "90", "BPM should persist across a reload");
  } finally {
    fresh.iframe.remove();
  }
});

// ---- settings persistence ----

test("settings survive a reload", async (doc, win, ctx) => {
  doc.querySelector('.theme-swatch[data-theme="neon"]').click();
  doc.querySelector('.sensitive-mode-pill[data-sensitive-mode="off"]').click();
  await sleep(50);
  const fresh = await loadFreshApp();
  try {
    assertEqual(fresh.doc.documentElement.getAttribute("data-theme"), "neon", "theme should persist");
    fresh.doc.getElementById("advancedDetails").open = true;
    assert(fresh.doc.querySelector('.sensitive-mode-pill[data-sensitive-mode="off"]').classList.contains("active"), "sensitive mode should persist");
  } finally {
    fresh.iframe.remove();
  }
});

test("reset default settings requires two clicks and restores defaults", async (doc, win, ctx) => {
  doc.getElementById("advancedDetails").open = true;
  doc.querySelector('.theme-swatch[data-theme="neon"]').click();
  doc.querySelector('.sensitive-mode-pill[data-sensitive-mode="off"]').click();
  await sleep(50);

  const btn = doc.getElementById("resetSettingsBtn");
  assertEqual(btn.textContent, "Reset default settings");
  btn.click();
  assertEqual(btn.textContent, "Click again to confirm", "first click should arm the reset, not fire it");
  assertEqual(doc.documentElement.getAttribute("data-theme"), "neon", "settings should be untouched after only one click");

  await new Promise((resolve) => {
    ctx.iframe.addEventListener("load", resolve, { once: true });
    btn.click();
  });
  await sleep(500); // let the reloaded app's own init (generate(), practices fetch, etc.) settle
  const freshDoc = ctx.iframe.contentDocument;
  assertEqual(freshDoc.documentElement.getAttribute("data-theme"), "dark", "theme should be back to its default after reset");
  freshDoc.getElementById("advancedDetails").open = true;
  assert(freshDoc.querySelector('.sensitive-mode-pill[data-sensitive-mode="on"]').classList.contains("active"), "sensitive mode should be back to its default (Filter out) after reset");
});

// ---- difficulty/syllable sliders respond to drag ----

test("syllable range slider responds to a drag", async (doc) => {
  doc.getElementById("advancedDetails").open = true;
  const track = doc.querySelector(".syl-slider .diff-slider-track");
  const rect = track.getBoundingClientRect();
  const x = rect.left + rect.width * 0.4;
  const y = rect.top + rect.height / 2;
  fire(track, "pointerdown", x, y);
  fire(track, "pointerup", x, y);
  assert(doc.getElementById("sylRangeValue").textContent !== "Any", "dragging the slider should change the displayed range");
});

// ---- share links ----

test("share buttons: WhatsApp/Facebook open the right share URLs, Instagram copies the link", async (doc, win) => {
  const opened = [];
  win.open = (url) => { opened.push(url); return null; };
  let copiedText = null;
  Object.defineProperty(win.navigator, "clipboard", {
    value: { writeText: (text) => { copiedText = text; return Promise.resolve(); } },
    configurable: true,
  });

  doc.getElementById("shareWhatsappBtn").click();
  assert(opened[0].startsWith("https://wa.me/?text="), "WhatsApp button should open a wa.me share link");
  assert(decodeURIComponent(opened[0]).includes(win.location.href), "WhatsApp share text should include the page URL");

  doc.getElementById("shareFacebookBtn").click();
  assert(opened[1].startsWith("https://www.facebook.com/sharer/sharer.php?u="), "Facebook button should open the FB sharer");
  assertEqual(decodeURIComponent(opened[1].split("u=")[1]), win.location.href, "Facebook share URL should be the page URL");

  doc.getElementById("shareInstagramBtn").click();
  assertEqual(opened[2], "https://www.instagram.com/", "Instagram button should open instagram.com");
  await sleep(50);
  assertEqual(copiedText, win.location.href, "Instagram button should copy the page URL to the clipboard");
  assert(doc.getElementById("shareStatus").textContent.length > 0, "share status should show a message after the Instagram click");
});

// ---- runner ----

async function runAll() {
  const results = [];
  for (const { name, fn } of tests) {
    let ctx;
    try {
      // smoke.html and rg-latest.html are same-origin (same http server),
      // so this clears the storage each test's first iframe loads with.
      // Needed now that timerMode/timerLoop/timerDurationMinutes persist
      // (previously only theme/timerSound/etc did) — otherwise one test's
      // saved state leaks into the next test's "fresh" iframe. Cleared only
      // here, once per top-level test, not inside loadFreshApp() itself —
      // "settings survive a reload" calls loadFreshApp() a second time
      // mid-test specifically to check its own just-saved settings persist.
      localStorage.clear();
      ctx = await loadFreshApp();
      await fn(ctx.doc, ctx.win, ctx);
      if (ctx.errors.length) throw new Error("uncaught error(s) in app: " + ctx.errors.join(" | "));
      results.push({ name, pass: true });
    } catch (e) {
      results.push({ name, pass: false, error: e.message });
    } finally {
      if (ctx) ctx.iframe.remove();
    }
  }
  return results;
}

runAll().then((results) => {
  const passCount = results.filter((r) => r.pass).length;
  const failCount = results.length - passCount;
  document.getElementById("summary").textContent = `${passCount}/${results.length} passed` + (failCount ? `, ${failCount} FAILED` : "");
  document.getElementById("summary").className = failCount ? "fail" : "pass";
  document.getElementById("output").innerHTML = results.map((r) =>
    r.pass
      ? `<div class="pass">✓ ${r.name}</div>`
      : `<div class="fail">✗ ${r.name}\n    ${r.error}</div>`
  ).join("\n");
  // machine-readable summary for test/run.sh to grep
  const marker = document.createElement("div");
  marker.id = "smoke-test-result";
  marker.setAttribute("data-json", JSON.stringify({ passCount, failCount, total: results.length, results }));
  document.body.appendChild(marker);

  // test/run.sh can't rely on --dump-dom's timing (it doesn't wait around
  // for a page that keeps loading iframes for several seconds after its own
  // load event) — polling the DevTools /json endpoint's live "title" field
  // instead needs no such wait. Base64 keeps the JSON's quotes/newlines from
  // upsetting whatever's reading document.title.
  document.title = "SMOKE_DONE:" + btoa(unescape(encodeURIComponent(
    JSON.stringify({ passCount, failCount, total: results.length, results })
  )));
});
</script>
